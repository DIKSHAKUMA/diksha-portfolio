query folio {
  about(where: {slug: "thomas-thorstensson"}) {
    name
    bio
    intro
  }

  intro(where: {slug: "intros"}) {
    aboutIntroTitle
    aboutIntroDesc
    projIntroTitle
    projIntroDesc
    metaTechTitle
    metaTechDesc
    metaCreativeTitle
    metaCreativeDesc
    metaIdeTitle
    metaIdeDesc
    metaPublishTitle
    metaPublishDesc
    techIntroTitle
    techIntroDesc
    techOneTitle
    techOneDesc
    techTwoTitle
    techTwoDesc
    techThreeTitle
    techThreeDesc
  }

  projects {
    name
    client
    endclient
    date
    demo
    description
    id
    sourceCode
    slug
    tags
    testimonialName
    testimonialAgency
    testimonialText
    image {
      id
      handle
      fileName
    }
  }
}